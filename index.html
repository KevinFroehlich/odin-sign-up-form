<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="fullpage-container">
        <div class="background-logo-container">
            <div class="logo-background-bar">
                 <img src="./pics/sauronlogo.jpeg" alt="Sauron-Logo" class="sauron-logo">
                <div class="logo-name">Sauron Inc.</div>
            </div>
            <div class="photo-credit">Photo by chatgpt on chatgpt.com</div>
        </div>
        <div class="header-form-submit-container">
            <div class="header"><p>
                Looking for lost valuables? <br>Trying to find someone you just can't seem to get into contact with? <br>Don't let your opportunities melt away. Use palantir, by sauron inc.
                <br>
                <br>
                The dark lord commands it.
            </p></div>
            <form action="" method="post" class="account-form">
                <div class="input-area">
                    <p>Do not fail him now.</p>
                    <div class="form-row">
                        <label for="first_name">
                            <span>first Name</span>
                            <input type="text" name="first_name" id="first_name">
                        </label>
                        <label for="last_name">
                            <span>last Name</span>
                            <input type="text" name="last_name" id="last_name">
                        </label>
                    </div>
                    <div class="form-row">
                        <label for="email">
                           <span>email</span>
                            <input type="email" name="email" id="email">
                        </label>
                        <label for="phonenumber"><span>phone Number</span>
                            <input type="number" name="phonenumber" id="phonenumber">
                        </label>
                    </div>
                    <div class="form-row">
                        <label for="password">
                            <span>password</span>
                            <input type="password" id="password" name="password">
                        </label>
                        
                        <label for="confirm_password">
                            <span>confirm password</span>
                             <input type="password" name="confirm_password" id="confirm_password">
                        </label>
                    </div>
                </div>
                <div class="submit-area">
                    <button type="submit" class="submit-button">Create Account</button>
                    <p>Already have an account? <strong>Log in</strong></p>

                </div>
            </form>
        </div>
    </div>
</body>
</html>
